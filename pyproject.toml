[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-atlas"
version = "0.1.0"
description = "Declarative spatio-temporal forensic data processing from CSV, Excel, and SQLite sources into a canonical observation model."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Recovery Tools",
]
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    # zoneinfo needs the IANA tz database; Windows has no system copy, so ship it there.
    "tzdata; platform_system == 'Windows'",
    "s2sphere>=0.2.5",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
gui = [
    "PySide6>=6.7",
]
# ufdr_parser is a standalone side package; its lxml/psutil deps are kept out of the
# model_atlas core so a core install stays lean.
ufdr = [
    "lxml>=5.0",
    "psutil>=5.9",
]

[project.scripts]
matlas = "launcher.cli:run"
matlas-gui = "launcher.gui:run"
ufdr-parser = "ufdr_parser.cli:main"

# Explicit package list: the repo uses a flat layout with four top-level
# packages. Auto-discovery refuses flat-layout multi-package projects, so we
# list them here. Keep this in step with the actual package tree (dirs holding
# an __init__.py) — a stale entry fails the editable build with
# "package directory '...' does not exist".
[tool.setuptools]
packages = [
    "gui",
    "gui.widgets",
    "launcher",
    "model_atlas",
    "model_atlas.analyse",
    "model_atlas.analyse.helpers",
    "model_atlas.analyse.concomitance",
    "model_atlas.analyse.untangle",
    "model_atlas.app",
    "model_atlas.core",
    "model_atlas.export",
    "model_atlas.ingest",
    "model_atlas.ingest.readers",
    "model_atlas.ingest.readers.xml_specifics",
    "model_atlas.ingest.utils",
    "model_atlas.ingest.utils.mobile_containers",
    "model_atlas.ingest.utils.mobile_containers.android",
    "model_atlas.ingest.utils.mobile_containers.ios",
    "model_atlas.integrate",
    "model_atlas.presets",
    "model_atlas.sqlite",
    "ufdr_parser",
    "ufdr_parser.model_signatures",
    "ufdr_parser.bricks",
    "ufdr_parser.bricks.workbook",
]

[tool.setuptools.package-data]
gui = ["*.ui", "assets/*"]
"ufdr_parser.bricks.workbook" = ["*.toml"]
