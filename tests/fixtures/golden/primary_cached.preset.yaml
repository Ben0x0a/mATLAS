# Golden fixture: a PRIMARY preset with NO source_record_uid, so the engine generates a
# deterministic, content-addressed uuid5 (fingerprint | raw_source_path | input_record_id).
# input_record_id is unmapped here, so it defaults to "#<ordinal>".
preset:
  id: golden.primary.cached
  name: Golden Primary Cached
  os: iOS
  os_version: ">=15"
  version: 1.0
  tier: primary

input_selector:
  format: csv
  name: cached.csv

expected_fields:
  - Latitude
  - Longitude
  - "Accuracy (m)"
  - "Speed (m/s)"
  - "Timestamp Date/Time - UTC+00:00 (dd.MM.yyyy)"
  - Source
  - Location
  - "Item ID"

common:
  entity:          const(device)
  entity_type:     const(device)
  source_label:    const(ZRTCLLOCATIONMO)
  position_source: const(GNSS)
  raw_source_path: field(Source)

observations:
  - position:
      latitude:              field(Latitude)
      longitude:             field(Longitude)
      position_type:        const(coordinate)
      spatial_referential:   const(epsg:4326)   # the datum for the coordinates
      horizontal_accuracy_m: { from: 'field("Accuracy (m)")', unit: m }
      horizontal_speed_kmh:  { from: 'field("Speed (m/s)")', unit: m/s }
    time:
      instant: 'field("Timestamp Date/Time - UTC+00:00 (dd.MM.yyyy)")'
      format:  "%d.%m.%Y %H:%M:%S.%f"
      zone:    const(UTC+00:00)
    links:
      # A device's OWN GNSS cache: the device holds its own position (`subject`, so it is
      # its own bearer), the position was measured, and an instant is `at_least_once`.
      entity:   subject
      spatial:  measured
      temporal: at_least_once