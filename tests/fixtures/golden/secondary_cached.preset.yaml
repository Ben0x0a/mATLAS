# Golden fixture: a SECONDARY (tool export) preset that maps source_record_uid to the tool's
# own id column, so source_record_uid is the tool value verbatim.
preset:
  id: golden.secondary.cached
  name: Golden Secondary Cached
  os: iOS
  tool: AXIOM
  os_version: ">=15"
  version: 1.0
  tier: secondary

input_selector:
  format: csv
  name: cached.csv

expected_fields:
  - Latitude
  - Longitude
  - "Accuracy (m)"
  - "Speed (m/s)"
  - "Timestamp Date/Time - UTC+00:00 (dd.MM.yyyy)"
  - Source
  - Location
  - "Item ID"

source_record_uid: 'field("Item ID")'

common:
  entity:          const(device)
  entity_type:     const(device)
  source_label:    const(ZRTCLLOCATIONMO)
  position_source: const(GNSS)
  attestation:     const(instrument)
  input_record_id: field(Location)
  raw_source_path: field(Source)

observations:
  - position:
      latitude:              field(Latitude)
      longitude:             field(Longitude)
      spatial_referential:   const(epsg:4326)   # the datum for the coordinates
      horizontal_accuracy_m: { from: 'field("Accuracy (m)")', unit: m }
      horizontal_speed_kmh:  { from: 'field("Speed (m/s)")', unit: m/s }
    time:
      instant: 'field("Timestamp Date/Time - UTC+00:00 (dd.MM.yyyy)")'
      format:  "%d.%m.%Y %H:%M:%S.%f"
      zone:    const(UTC+00:00)
    links:
      # A device's OWN GNSS cache: the position is the device's, so there is no bearer
      # (`self`), it is at the point, and the fix is a single observation over a degenerate
      # interval. `observed_at` is gone — when the record was written is now `recorded_at`,
      # and who measured it is `attestation`.
      entity:   self
      spatial:  at
      temporal: once
